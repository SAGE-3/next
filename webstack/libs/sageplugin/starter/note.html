<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared note</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <label for="body">Shared note</label>
      <textarea id="body" disabled placeholder="Write together…"></textarea>
      <footer>
        <button id="save" disabled>Save now</button>
        <span id="status" role="status" aria-live="polite">Connecting…</span>
      </footer>
    </main>
    <script src="note.js"></script>
  </body>
</html>
