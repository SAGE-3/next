<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>flashcards</title>
    <script src="flashcards.js" defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" />
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        padding: 14px;
      }

      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border: 4px solid var(--ink);
        border-radius: var(--wobble);
        padding: 16px 22px;
        box-shadow: 7px 9px 0 rgba(0, 0, 0, 0.3);
      }

      header {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      header h1 {
        font-family: var(--marker);
        font-weight: 700;
        font-size: 40px;
        margin: 0;
      }

      header h1 span {
        background: linear-gradient(100deg, transparent 1%, var(--purple) 3%, var(--purple) 97%, transparent 99%);
        padding: 0 12px;
        border-radius: 6px 14px 8px 16px;
      }

      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-left: auto;
        font-size: 19px;
      }

      .f {
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 1px 10px;
        cursor: pointer;
        background: #fff;
      }

      .f.on {
        background: var(--fc);
        box-shadow: 2px 2px 0 var(--ink);
      }

      .stage {
        flex: 1;
        min-height: 0;
        perspective: 1600px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 100%;
        height: 100%;
        max-width: 1100px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.55s cubic-bezier(0.3, 1.3, 0.5, 1);
        cursor: pointer;
      }

      .card.flip {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px 60px;
        border: 3px solid var(--ink);
        border-radius: 6px;
        box-shadow: 5px 7px 0 rgba(0, 0, 0, 0.25);
      }

      .front {
        background: #fff;
        background-image:
          linear-gradient(transparent 70px, rgba(220, 60, 60, 0.55) 70px, rgba(220, 60, 60, 0.55) 72px, transparent 72px),
          repeating-linear-gradient(#fff 0 39px, rgba(70, 120, 200, 0.2) 39px 40px);
      }

      .back {
        background: var(--yellow);
        transform: rotateY(180deg);
      }

      .face .tag {
        position: absolute;
        top: 18px;
        left: 22px;
        font-size: 20px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 0 10px;
        background: var(--tc);
      }

      .face .num {
        position: absolute;
        top: 18px;
        right: 24px;
        font-family: var(--script);
        font-size: 28px;
        color: var(--ink2);
      }

      .q {
        font-family: var(--hand);
        font-size: 42px;
        line-height: 1.22;
      }

      .a {
        font-family: var(--hand);
        font-size: 34px;
        line-height: 1.28;
      }

      .a b {
        font-weight: 700;
        background: rgba(255, 255, 255, 0.65);
        padding: 0 6px;
        border-radius: 5px;
      }

      .hint {
        position: absolute;
        bottom: 14px;
        font-family: var(--script);
        font-size: 24px;
        color: var(--ink2);
      }

      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .tally {
        font-size: 22px;
        margin-left: auto;
        display: flex;
        gap: 18px;
        align-items: center;
      }

      .prog {
        width: 280px;
        height: 20px;
        border: 2.5px solid var(--ink);
        border-radius: 6px 10px 5px 9px;
        overflow: hidden;
        background: #fff;
      }

      .prog div {
        height: 100%;
        background: repeating-linear-gradient(-45deg, var(--green) 0 8px, #e5f3d3 8px 14px);
        border-right: 2px solid var(--ink);
        transition: width 0.4s;
      }

      .done {
        font-family: var(--marker);
        font-weight: 700;
        font-size: 46px;
      }

      .ed {
        position: absolute;
        inset: 0;
        z-index: 30;
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 6px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 22px;
      }

      .ed textarea,
      .ed select {
        font-family: var(--hand);
        font-size: 24px;
        border: 2px solid var(--ink);
        border-radius: 6px;
        padding: 8px 12px;
        background: #fff;
      }

      .ed textarea {
        flex: 1;
        resize: none;
      }

      .ed .row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        align-items: center;
      }

      .stage {
        position: relative;
      }
    </style>
  </head>

  <body>
    <div class="wrap paper">
      <header>
        <h1><span>quiz myself</span></h1>
        <div class="filters" id="filters"></div>
      </header>

      <div class="stage">
        <div class="card" id="card"></div>
      </div>

      <footer>
        <button class="btn" id="prev">◀</button>
        <button class="btn" id="again" style="background: #ffe1e9">again ↺</button>
        <button class="btn" id="got" style="background: #e5f3d3">got it ✓</button>
        <button class="btn" id="next">▶</button>
        <button class="btn" id="shuf" style="font-size: 18px">shuffle</button>
        <button class="btn" id="reset" style="font-size: 18px">reset</button>
        <button class="btn" id="add" style="font-size: 18px">＋ card</button>
        <button class="btn" id="edit" style="font-size: 18px">✎ edit</button>

        <div class="tally">
          <span id="tally"></span>
          <div class="prog">
            <div id="bar"></div>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
