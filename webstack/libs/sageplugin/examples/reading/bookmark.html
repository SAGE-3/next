<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reading bookmark</title>
    <link rel="stylesheet" href="reading.css" />
    <script src="bookmark.js" defer></script>
  </head>

  <body>
    <h1>Reading bookmark</h1>
    <p id="source">Connecting to SAGE3…</p>

    <label for="page">Saved page (starts at 1)</label>
    <div><input id="page" type="number" min="1" step="1" /><button id="save" type="button" disabled>Save page</button></div>
    <button id="open" type="button" disabled>Return to source</button>
    <p>Saved pages are shared. Returning to the source changes the PDF page for everyone on this board.</p>

    <details>
      <summary>Choose or replace source</summary>
      <label for="pdf">PDF on this board</label>
      <select id="pdf"></select>
      <button id="attach" type="button" disabled>Save its current page</button>
    </details>

    <p id="status" role="status" aria-live="polite"></p>
  </body>
</html>
