name: AI Fix Issue

# Owner labels an issue `ai_fix_it` -> agent branches off dev, attempts the
# fix, and opens a PR back into dev for owner review.
#
# WHY THE LABEL IS NOT SUFFICIENT ON ITS OWN: applying a label only requires
# triage or write access, and this repo has 30 collaborators with write. The
# label narrows the trigger to the team, not to the two people in
# SAGE-3/owners, so the `authorize` job below checks team membership
# explicitly and strips the label back off if someone else applied it.
# Anyone can *open* an issue; only an owner can point the agent at one.
#
# NOTE: `issues` is a repository-scoped event, so GitHub reads this file from
# the DEFAULT branch (main) -- not from dev, and not from the PR that adds it.
# It does nothing until it has been promoted to main.

on:
  issues:
    types: [labeled]

# The job's own GITHUB_TOKEN needs nothing: every write goes through the App
# installation token created below.
permissions:
  contents: read

# Re-labelling a busy issue should queue, not race two agents onto one branch.
concurrency:
  group: ai-fix-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Runs before anything touches the proxy key. An unauthorized label is
  # removed rather than merely ignored, so the issue does not sit there
  # looking queued for an agent that will never come.
  authorize:
    if: github.event.label.name == 'ai_fix_it'
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SAGE3_BOT_APP_ID }}
          private-key: ${{ secrets.SAGE3_BOT_PRIVATE_KEY }}

      - name: Check actor is in SAGE-3/owners
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
          ACTOR: ${{ github.event.sender.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          state=$(gh api "orgs/$ORG/teams/owners/memberships/$ACTOR" --jq '.state' 2>/dev/null || echo "none")
          if [ "$state" = "active" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "::warning::$ACTOR is not in $ORG/owners; removing the label."
          gh issue edit "$ISSUE_NUMBER" --remove-label ai_fix_it
          gh issue comment "$ISSUE_NUMBER" \
            --body "@$ACTOR the \`ai_fix_it\` label can only be applied by a member of \`$ORG/owners\`, so it has been removed and no agent was run. Please ask an owner to label this issue."

  fix:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # An App installation token, NOT secrets.GITHUB_TOKEN. A run's own
      # GITHUB_TOKEN cannot trigger further workflow runs, so a PR opened with
      # it would never fire Webstack CI -- leaving the required `run (24)`
      # check pending forever and the PR permanently unmergeable, because
      # `Dev Branch CI Rules` has an empty bypass list (verified in #1407).
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SAGE3_BOT_APP_ID }}
          private-key: ${{ secrets.SAGE3_BOT_PRIVATE_KEY }}

      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # LITELLM_BASE_URL is stored without the /v1 suffix (matching how
      # seer/libs/llm_manager.py normalizes it). Aider talks OpenAI-compatible
      # and wants the versioned path, so add it here if absent rather than
      # depending on how the secret happened to be typed.
      - name: Normalize proxy base URL
        env:
          RAW_BASE: ${{ secrets.LITELLM_BASE_URL }}
        run: |
          set -euo pipefail
          base="${RAW_BASE%/}"
          case "$base" in
            */v1) ;;
            *) base="$base/v1" ;;
          esac
          echo "OPENAI_API_BASE=$base" >> "$GITHUB_ENV"

      # Fail loudly and early if the proxy is unreachable or the configured
      # model is not one it serves. Without this the run dies deep inside
      # Aider with an opaque routing error.
      - name: Preflight proxy and model
        env:
          OPENAI_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          MODEL: ${{ vars.AIDER_MODEL || 'gpt-5.6-terra' }}
          EDITOR_MODEL: ${{ vars.AIDER_EDITOR_MODEL || vars.AIDER_MODEL || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          curl -sS --max-time 20 -H "Authorization: Bearer $OPENAI_API_KEY" \
            "$OPENAI_API_BASE/models" > /tmp/models.json
          python3 - <<'PY'
          import json, os, sys
          ids = {m.get("id") for m in json.load(open("/tmp/models.json")).get("data", [])}
          missing = [m for m in {os.environ["MODEL"], os.environ["EDITOR_MODEL"]} if m not in ids]
          if missing:
              print(f"::error::Model(s) not served by the proxy: {', '.join(sorted(missing))}")
              print("Available: " + ", ".join(sorted(ids)))
              sys.exit(1)
          print("Preflight OK. Models available: " + ", ".join(sorted(ids)))
          PY

      - name: Install Aider
        run: pipx install aider-chat

      # The issue body is untrusted, attacker-authored text. It is passed via
      # env and written with printf -- never interpolated into the shell as
      # ${{ }}, which would be a command injection on a public repo.
      - name: Build task prompt
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' "Fix the following GitHub issue in this repository."
            printf '%s\n' "Make the smallest change that resolves it. Do not refactor"
            printf '%s\n\n' "unrelated code. Follow the conventions already in the files you touch."
            printf 'Issue #%s: %s\n\n' "$ISSUE_NUMBER" "$ISSUE_TITLE"
            printf '%s\n' "$ISSUE_BODY"
          } > /tmp/ai-task.md

      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"

      # Re-labelling an issue that already has an agent branch continues that
      # work instead of starting from dev again -- otherwise the push below
      # would be a non-fast-forward against an open PR.
      - name: Create or resume working branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          branch="ai/issue-$ISSUE_NUMBER"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --quiet origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Aider only edits files that are in its chat. Naming them in the issue
      # text is not enough -- the model reads the prose, but the editable set
      # stays empty, so the editor produces a diff with nowhere to land and
      # the "which files should I add?" fallback guesses. That is exactly what
      # happened on issue #1417: the right one-word diff was generated and
      # then dropped, because LICENSE was what the fallback picked.
      #
      # So resolve `Files:` / `Folder:` here and pass the paths to aider as
      # real arguments. Absent the line, behaviour is unchanged -- aider falls
      # back to the repo map, which is lossy across 3 Node services, 44 apps
      # and a Python tree, but still works for an obvious change.
      - name: Resolve target files
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          MAX_FILES: ${{ vars.AIDER_MAX_FILES || 20 }}
        run: |
          set -euo pipefail
          : > /tmp/ai-files.txt

          # `|| true` because no match is the normal case, not an error, and
          # pipefail would otherwise abort the step.
          raw=$(printf '%s\n' "$ISSUE_BODY" \
                  | grep -iE '^[[:space:]]*(files?|folders?|dirs?):' || true)

          if [ -z "$raw" ]; then
            echo "No Files:/Folder: line; aider will fall back to the repo map."
            exit 0
          fi

          # Untrusted text even though only owners can label: reject absolute
          # paths, traversal and anything that would read as a flag, and keep
          # only paths that actually exist in the checkout.
          printf '%s\n' "$raw" \
            | sed -E 's/^[[:space:]]*[A-Za-z]+:[[:space:]]*//' \
            | tr ',' '\n' \
            | tr -d '`"'"'" \
            | tr -s '[:space:]' '\n' \
            | while IFS= read -r p; do
                [ -n "$p" ] || continue
                p="${p%/}"
                case "$p" in
                  /*|*..*|-*)
                    echo "::warning::Ignoring unsafe path in Files: '$p'"; continue ;;
                esac
                if [ -f "$p" ]; then
                  printf '%s\n' "$p" >> /tmp/ai-files.txt
                elif [ -d "$p" ]; then
                  n=$(git ls-files -- "$p" | wc -l | tr -d ' ')
                  if [ "$n" -eq 0 ]; then
                    echo "::warning::'$p' holds no tracked files; ignoring."
                  elif [ "$n" -gt "$MAX_FILES" ]; then
                    # Fail here, before a single token is spent. Silently
                    # editing an arbitrary subset of a large folder is worse
                    # than refusing: it looks like it worked.
                    echo "::error::'$p' holds $n tracked files, over the $MAX_FILES cap. Name individual files or a narrower folder."
                    exit 3
                  else
                    echo "Folder '$p' -> $n files"
                    git ls-files -- "$p" >> /tmp/ai-files.txt
                  fi
                else
                  echo "::warning::Files: names '$p', which does not exist in the repo; ignoring."
                fi
              done

          sort -u -o /tmp/ai-files.txt /tmp/ai-files.txt
          echo "Resolved $(wc -l < /tmp/ai-files.txt | tr -d ' ') file(s):"
          cat /tmp/ai-files.txt

      # --architect splits planning from editing so a stronger (pricier) model
      # reasons about the change and a cheaper one writes the diff. Both point
      # at the same model until a second one is chosen; the split costs
      # nothing to leave wired.
      #
      # --editor-edit-format is NOT cosmetic. --architect defaults the editor
      # to `editor-whole`, which makes it reproduce the entire file to change
      # one line. On a 1,100-line file that is ~9.5k output tokens and a
      # minute of wall clock, and it walks straight into upstream aider bug
      # #5706: aider scans the editor's reply for anything that looks like a
      # repo filename, and our copyright header ends every source file with
      # "the file LICENSE, distributed as part of this software." It matches
      # the tracked `LICENSE` at the repo root, auto-adds it under
      # --yes-always, and then RETURNS BEFORE apply_updates() -- discarding
      # the correct edit it had just produced. That is the whole reason #1417
      # produced a perfect one-word diff, committed nothing, and still went
      # green. `editor-diff` emits a SEARCH/REPLACE block instead, so the
      # header never enters the reply. See also .aiderignore, which closes
      # the same hole from the other side.
      - name: Run Aider
        env:
          OPENAI_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          MODEL: ${{ vars.AIDER_MODEL || 'gpt-5.6-terra' }}
          EDITOR_MODEL: ${{ vars.AIDER_EDITOR_MODEL || vars.AIDER_MODEL || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail

          # Positional paths go in aider's chat, which is the set it is allowed
          # to edit. Read line-by-line rather than word-splitting so a path
          # containing a space survives.
          files=()
          if [ -s /tmp/ai-files.txt ]; then
            while IFS= read -r f; do files+=("$f"); done < /tmp/ai-files.txt
          fi

          aider ${files[@]+"${files[@]}"} \
            --architect \
            --model "openai/$MODEL" \
            --editor-model "openai/$EDITOR_MODEL" \
            --editor-edit-format editor-diff \
            --message-file /tmp/ai-task.md \
            --yes-always \
            --no-auto-lint \
            --no-auto-test \
            --no-stream \
            --no-analytics \
            --no-check-update \
            --auto-commits

      - name: Push branch and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          # Compare against the SHA recorded before Aider ran. Diffing against
          # origin/dev instead would misreport whenever dev has moved on.
          #
          # This is exit 1, not exit 0. A run that spends real money on the
          # proxy and lands nothing is a failure, and three of them in a row
          # reported as green checks while #1417 sat untouched -- the old
          # comment even blamed the issue for lacking detail when the issue
          # was fine and aider had thrown the edit away (upstream #5706).
          # Upstream has no fix merged, so assume this recurs and make it red.
          if [ "$(git rev-parse HEAD)" = "$BEFORE_SHA" ]; then
            echo "::error::Aider produced no commits for issue #$ISSUE_NUMBER."
            gh issue comment "$ISSUE_NUMBER" \
              --body "The AI agent ran but committed nothing, so no PR was opened. Check the run log: if it printed a diff and then a bare filename (aider auto-adding a file it thought was requested), the edit was discarded by upstream aider bug #5706 and re-labelling may succeed. Otherwise the issue may need more detail, or a \`Files:\` line naming the file to change."
            exit 1
          fi

          # Fast-forward only: the branch was based on its own remote head
          # above, so this never needs --force and must never rewrite history
          # under a PR someone is already reviewing.
          git push origin "HEAD:$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "Pushed another pass after the issue was re-labelled."
            exit 0
          fi

          {
            printf '%s\n\n' "Automated attempt at #$ISSUE_NUMBER, opened by the CI coding agent."
            printf '%s\n\n' "Closes #$ISSUE_NUMBER"
            printf '%s\n' "**This is unreviewed machine-generated code.** Comment on this PR to"
            printf '%s\n' "send the agent another pass; merge only after an owner review and a"
            printf '%s\n' "green \`run (24)\`."
          } > /tmp/pr-body.md

          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "ai: $ISSUE_TITLE (#$ISSUE_NUMBER)" \
            --body-file /tmp/pr-body.md
