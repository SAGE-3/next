name: Webstack CI

on:
  push:
    branches:
      - dev
  pull_request:

defaults:
  run:
    shell: bash
    working-directory: webstack

jobs:
  run:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 24

    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --silent

      - name: Run tests
        # Scoped to projects with a working jest config today, not --all: most
        # other Nx projects (webapp, sageplugin, homebase*) have a test target
        # declared in workspace.json but no jest.config.js ever created (or
        # are missing jest-environment-jsdom) — a pre-existing gap. Widen this
        # list as those get fixed.
        #
        # REDIS_TEST_URL points SBAuthDatabase.integration.spec.ts at the real
        # Redis Stack service above; that file skips entirely if unset, so
        # `yarn test` still runs cleanly on a machine without Redis.
        env:
          REDIS_TEST_URL: redis://localhost:6379
        run: yarn nx run-many --target=test --projects=sagebase,shared,backend --parallel=1

      - name: Build Homebase
        run: yarn build

      - name: Build Webapp
        run: yarn build webapp
