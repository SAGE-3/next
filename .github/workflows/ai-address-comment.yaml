name: AI Address PR Comment

# An owner comments on an agent-authored PR -> the agent takes another pass
# and pushes more commits to the same branch. Repeat until it is good enough
# to merge.
#
# NOTE: `issue_comment` and `pull_request_review_comment` are repository-scoped
# events, so GitHub reads this file from the DEFAULT branch (main) -- not from
# dev. It does nothing until it has been promoted to main.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

# Two quick comments must not run two agents against one branch; the second
# would push over the first. Queue instead of racing.
concurrency:
  group: ai-comment-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  address:
    # Four gates, all required:
    #   - not a bot, or the agent's own summary comment retriggers it forever
    #   - author_association limits spend to people with repo access; without
    #     it any drive-by commenter burns NAIRR credits on our proxy key
    #   - must be a PR, since issue_comment also fires on plain issues
    #   - `[skip ai]` lets owners talk to each other without paying for a run
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null) &&
      !contains(github.event.comment.body, '[skip ai]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SAGE3_BOT_APP_ID }}
          private-key: ${{ secrets.SAGE3_BOT_PRIVATE_KEY }}

      # Resolved at runtime because a comment event carries no ref for the PR
      # branch. Also the fork check: this job holds the proxy key, so it must
      # never check out code from a repository we do not control.
      - name: Resolve target PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" \
            --json headRefName,isCrossRepository,state > /tmp/pr.json

          head=$(python3 -c "import json;print(json.load(open('/tmp/pr.json'))['headRefName'])")
          fork=$(python3 -c "import json;print(json.load(open('/tmp/pr.json'))['isCrossRepository'])")
          state=$(python3 -c "import json;print(json.load(open('/tmp/pr.json'))['state'])")

          if [ "$fork" != "False" ]; then
            echo "Refusing to run against a fork PR." && echo "run=false" >> "$GITHUB_OUTPUT" && exit 0
          fi
          if [ "$state" != "OPEN" ]; then
            echo "PR is $state, nothing to do." && echo "run=false" >> "$GITHUB_OUTPUT" && exit 0
          fi
          case "$head" in
            ai/*) ;;
            *) echo "Head branch '$head' is not agent-owned; ignoring." && echo "run=false" >> "$GITHUB_OUTPUT" && exit 0 ;;
          esac

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v5
        if: steps.pr.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Normalize proxy base URL
        if: steps.pr.outputs.run == 'true'
        env:
          RAW_BASE: ${{ secrets.LITELLM_BASE_URL }}
        run: |
          set -euo pipefail
          base="${RAW_BASE%/}"
          case "$base" in
            */v1) ;;
            *) base="$base/v1" ;;
          esac
          echo "OPENAI_API_BASE=$base" >> "$GITHUB_ENV"

      - name: Install Aider
        if: steps.pr.outputs.run == 'true'
        run: pipx install aider-chat

      # Comment body is untrusted text -- passed via env, written with printf,
      # never interpolated into the shell.
      - name: Build task prompt
        if: steps.pr.outputs.run == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_PATH: ${{ github.event.comment.path }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "A reviewer left this feedback on your pull request."
            printf '%s\n\n' "Address it with the smallest change that satisfies the comment."
            if [ -n "${COMMENT_PATH:-}" ]; then
              printf 'The comment is on file: %s\n\n' "$COMMENT_PATH"
            fi
            printf '%s\n' "$COMMENT_BODY"
          } > /tmp/ai-task.md

      - name: Configure git identity
        if: steps.pr.outputs.run == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"

      - name: Run Aider
        if: steps.pr.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          MODEL: ${{ vars.AIDER_MODEL || 'gpt-5.6-terra' }}
          EDITOR_MODEL: ${{ vars.AIDER_EDITOR_MODEL || vars.AIDER_MODEL || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          aider \
            --architect \
            --model "openai/$MODEL" \
            --editor-model "openai/$EDITOR_MODEL" \
            --message-file /tmp/ai-task.md \
            --yes-always \
            --no-stream \
            --no-analytics \
            --no-check-update \
            --auto-commits

      - name: Push and report
        if: steps.pr.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          if git diff --quiet "origin/$HEAD_REF" HEAD; then
            gh pr comment "$PR_NUMBER" \
              --body "The AI agent ran but made no changes in response to that comment. It may need a more specific instruction, or the requested change may be outside the files it can edit (see \`.aiderignore\`)."
            exit 0
          fi

          git push origin "HEAD:$HEAD_REF"
          gh pr comment "$PR_NUMBER" \
            --body "Pushed a new pass addressing the latest comment. Re-review when \`run (24)\` reports."
