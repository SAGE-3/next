name: AI Address PR Comment

# An owner comments `@ai <instruction>` on an agent-authored PR -> the agent
# takes another pass and pushes more commits to the same branch. Repeat until
# it is good enough to merge.
#
# The mention is required so that ordinary review chatter ("lgtm", "why this
# approach?") costs nothing. Each pass is a 30-minute run billed to the NAIRR
# credits, so it is opt-in per comment rather than opt-out.
#
# NOTE: `issue_comment` and `pull_request_review_comment` are repository-scoped
# events, so GitHub reads this file from the DEFAULT branch (main) -- not from
# dev. It does nothing until it has been promoted to main.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

# Two agents must never run against one branch; the second would push over
# the first. Cancel rather than queue: submitting a review with a dozen inline
# comments fires a dozen events, and queueing them would mean a dozen
# sequential 30-minute runs billed to the NAIRR credits. The last comment
# wins, which is also the one that reflects the reviewer's final intent.
concurrency:
  group: ai-comment-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  address:
    # A cheap pre-filter only. It is NOT the authorization check: this repo
    # has 30 collaborators with write access, so COLLABORATOR would let any
    # of them spend NAIRR credits. Membership of SAGE-3/owners is verified
    # against the API in the "Resolve target PR" step below, before the proxy
    # key is used.
    #   - not a bot, or the agent's own summary comment retriggers it forever
    #   - must be a PR, since issue_comment also fires on plain issues
    #   - must mention @ai; a loose substring match here, tightened to a word
    #     boundary in the step below so "@aiden" does not summon the agent
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null) &&
      contains(github.event.comment.body, '@ai')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SAGE3_BOT_APP_ID }}
          private-key: ${{ secrets.SAGE3_BOT_PRIVATE_KEY }}

      # Resolved at runtime because a comment event carries no ref for the PR
      # branch. Also the fork check: this job holds the proxy key, so it must
      # never check out code from a repository we do not control.
      - name: Resolve target PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # The real authorization gate, and the first thing this step does:
          # no later step reads LITELLM_API_KEY or checks out any code until
          # it passes.
          #
          # It is NOT true that no secret is touched before this point: the
          # App token is minted in the step above, so any COLLABORATOR whose
          # comment contains `@ai` causes a contents:write installation token
          # to be created. That ordering is forced -- GITHUB_TOKEN cannot read
          # org team membership, so we need the App token to ask this very
          # question. The token is never exposed to repo content before the
          # check, but do not read this gate as "no secret exists yet".
          state=$(gh api "orgs/$ORG/teams/owners/memberships/$ACTOR" --jq '.state' 2>/dev/null || echo "none")
          if [ "$state" != "active" ]; then
            echo "$ACTOR is not in $ORG/owners; ignoring." && echo "run=false" >> "$GITHUB_OUTPUT" && exit 0
          fi

          # The job-level `if` matched @ai as a bare substring. Require a real
          # word boundary so "@aiden", "@ai-team" and an email address do not
          # spend a run.
          if ! printf '%s' "$COMMENT_BODY" | grep -qiE '(^|[^A-Za-z0-9_./-])@ai([^A-Za-z0-9_-]|$)'; then
            echo "No @ai mention; ignoring." && echo "run=false" >> "$GITHUB_OUTPUT" && exit 0
          fi

          pr=$(gh pr view "$PR_NUMBER" \
                 --json headRefName,headRefOid,isCrossRepository,state,author)
          head=$(printf '%s' "$pr" | jq -r '.headRefName')
          sha=$(printf '%s' "$pr" | jq -r '.headRefOid')
          fork=$(printf '%s' "$pr" | jq -r '.isCrossRepository')
          state=$(printf '%s' "$pr" | jq -r '.state')
          author=$(printf '%s' "$pr" | jq -r '.author.login')

          if [ "$fork" = "true" ]; then
            echo "Refusing to run against a fork PR." && echo "run=false" >> "$GITHUB_OUTPUT" && exit 0
          fi
          if [ "$state" != "OPEN" ]; then
            echo "PR is $state, nothing to do." && echo "run=false" >> "$GITHUB_OUTPUT" && exit 0
          fi

          # The real trust boundary. This job checks out the head branch and
          # runs an agent inside it, so that tree must be one WE produced.
          #
          # A branch name is not a boundary: this repo has 30 collaborators
          # with write access and nothing stops any of them pushing `ai/x`,
          # opening a PR, and waiting for an owner to type `@ai`. The owner
          # gate above would pass -- the owner is genuine -- and we would then
          # execute their tree with the proxy key in the environment. So
          # require that the agent itself opened this PR.
          #
          # GraphQL returns a Bot actor's login without the `[bot]` suffix
          # that the REST API uses; normalize so either form matches.
          expected="${APP_SLUG}[bot]"
          if [ "${author%\[bot\]}" != "${expected%\[bot\]}" ]; then
            echo "PR #$PR_NUMBER was opened by '$author', not the agent ($expected); ignoring." \
              && echo "run=false" >> "$GITHUB_OUTPUT" && exit 0
          fi

          # Defense in depth, not the boundary -- see above.
          case "$head" in
            ai/*) ;;
            *) echo "Head branch '$head' is not agent-owned; ignoring." && echo "run=false" >> "$GITHUB_OUTPUT" && exit 0 ;;
          esac

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # Pinned to the exact commit the gate above inspected, not to the branch
      # name. Resolving the name here instead would re-read the ref after the
      # checks ran, so a push landing in between would be what we check out.
      # The final `git push origin HEAD:$HEAD_REF` is the counterpart: if the
      # branch did move underneath us it fails non-fast-forward, which is the
      # correct outcome. Do not add --force to "fix" that.
      - name: Checkout PR branch
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Aider auto-loads .aider.conf.yml from the git root and, separately,
      # .env -- and that config can set lint-cmd/test-cmd (arbitrary commands)
      # and openai-api-base (which would redirect the proxy key to another
      # host). There is no flag to disable that loading; --config only adds a
      # file. So delete them. .aiderignore does not cover this: it stops the
      # agent EDITING those paths, not aider READING its own config.
      #
      # With the PR-author gate above these should never be hostile, but this
      # is what keeps a checked-out tree from choosing what commands run.
      - name: Drop repo-supplied agent config
        if: steps.pr.outputs.run == 'true'
        run: rm -f .aider.conf.yml .aider.conf.json .env

      - uses: actions/setup-python@v5
        if: steps.pr.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Normalize proxy base URL
        if: steps.pr.outputs.run == 'true'
        env:
          RAW_BASE: ${{ secrets.LITELLM_BASE_URL }}
        run: |
          set -euo pipefail
          base="${RAW_BASE%/}"
          case "$base" in
            */v1) ;;
            *) base="$base/v1" ;;
          esac
          echo "OPENAI_API_BASE=$base" >> "$GITHUB_ENV"

      - name: Install Aider
        if: steps.pr.outputs.run == 'true'
        run: pipx install aider-chat

      # Comment body is untrusted text -- passed via env, written with printf,
      # never interpolated into the shell.
      - name: Build task prompt
        if: steps.pr.outputs.run == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_PATH: ${{ github.event.comment.path }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "A reviewer left this feedback on your pull request."
            printf '%s\n\n' "Address it with the smallest change that satisfies the comment."
            if [ -n "${COMMENT_PATH:-}" ]; then
              printf 'The comment is on file: %s\n\n' "$COMMENT_PATH"
            fi
            printf '%s\n' "$COMMENT_BODY"
          } > /tmp/ai-task.md

      # Same reason as in ai-fix-issue.yaml: naming a file in the text does not
      # put it in aider's editable set, so the edit lands nowhere. Here there
      # are two sources -- an inline review comment already carries the file it
      # was left on, and the body may add a `Files:` line.
      - name: Resolve target files
        if: steps.pr.outputs.run == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_PATH: ${{ github.event.comment.path }}
          MAX_FILES: ${{ vars.AIDER_MAX_FILES || 20 }}
        run: |
          set -euo pipefail
          : > /tmp/ai-files.txt

          # An inline review comment knows its own file; trust it directly.
          if [ -n "${COMMENT_PATH:-}" ] && [ -f "$COMMENT_PATH" ]; then
            printf '%s\n' "$COMMENT_PATH" >> /tmp/ai-files.txt
          fi

          raw=$(printf '%s\n' "$COMMENT_BODY" \
                  | grep -iE '^[[:space:]]*(files?|folders?|dirs?):' || true)

          if [ -n "$raw" ]; then
            printf '%s\n' "$raw" \
              | sed -E 's/^[[:space:]]*[A-Za-z]+:[[:space:]]*//' \
              | tr ',' '\n' \
              | tr -d '`"'"'" \
              | tr -s '[:space:]' '\n' \
              | while IFS= read -r p; do
                  [ -n "$p" ] || continue
                  p="${p%/}"
                  case "$p" in
                    /*|*..*|-*)
                      echo "::warning::Ignoring unsafe path in Files: '$p'"; continue ;;
                  esac
                  if [ -f "$p" ]; then
                    printf '%s\n' "$p" >> /tmp/ai-files.txt
                  elif [ -d "$p" ]; then
                    n=$(git ls-files -- "$p" | wc -l | tr -d ' ')
                    if [ "$n" -eq 0 ]; then
                      echo "::warning::'$p' holds no tracked files; ignoring."
                    elif [ "$n" -gt "$MAX_FILES" ]; then
                      echo "::error::'$p' holds $n tracked files, over the $MAX_FILES cap. Name individual files or a narrower folder."
                      exit 3
                    else
                      echo "Folder '$p' -> $n files"
                      git ls-files -- "$p" >> /tmp/ai-files.txt
                    fi
                  else
                    echo "::warning::Files: names '$p', which does not exist in the repo; ignoring."
                  fi
                done
          fi

          sort -u -o /tmp/ai-files.txt /tmp/ai-files.txt
          echo "Resolved $(wc -l < /tmp/ai-files.txt | tr -d ' ') file(s):"
          cat /tmp/ai-files.txt

      - name: Configure git identity
        if: steps.pr.outputs.run == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"

      - name: Run Aider
        if: steps.pr.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          MODEL: ${{ vars.AIDER_MODEL || 'gpt-5.6-terra' }}
          EDITOR_MODEL: ${{ vars.AIDER_EDITOR_MODEL || vars.AIDER_MODEL || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail

          files=()
          if [ -s /tmp/ai-files.txt ]; then
            while IFS= read -r f; do files+=("$f"); done < /tmp/ai-files.txt
          fi

          aider ${files[@]+"${files[@]}"} \
            --architect \
            --model "openai/$MODEL" \
            --editor-model "openai/$EDITOR_MODEL" \
            --message-file /tmp/ai-task.md \
            --yes-always \
            --no-auto-lint \
            --no-auto-test \
            --no-stream \
            --no-analytics \
            --no-check-update \
            --auto-commits

      - name: Push and report
        if: steps.pr.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          if git diff --quiet "origin/$HEAD_REF" HEAD; then
            gh pr comment "$PR_NUMBER" \
              --body "The AI agent ran but made no changes in response to that comment. It may need a more specific instruction, or the requested change may be outside the files it can edit (see \`.aiderignore\`)."
            exit 0
          fi

          git push origin "HEAD:$HEAD_REF"
          gh pr comment "$PR_NUMBER" \
            --body "Pushed a new pass addressing the latest comment. Re-review when \`run (24)\` reports."
