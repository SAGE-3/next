# Override des images custom SAGE3 vers le registry local Gitea
# Usage : docker compose -f deployment/docker-compose-amd64.yml -f deployment/docker-compose.registry-override.yml up -d
services:
  node-server:
    image: 192.168.1.30:3000/gitea-admin/sage3-node-server:latest
  yjs-server:
    image: 192.168.1.30:3000/gitea-admin/sage3-yjs:latest
  files-server:
    image: 192.168.1.30:3000/gitea-admin/sage3-files:latest
  kernelserver:
    # host.docker.internal ne résout pas sur Linux sans extra_hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"
  chromadb:
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_AUTHN_PROVIDER=chromadb.auth.basic_authn.BasicAuthenticationServerProvider
      - CHROMA_SERVER_AUTHN_CREDENTIALS=sage3:$2b$04$6tt3ybouU/e9CMP/C68i2OPS5ywhhzoG7yPiaa4bHLrCGU5dn1AUa
  seer:
    environment:
      - ENVIRONMENT=production
      - SAGE3_SERVER=${SAGE3_SERVER}
      - TOKEN=${TOKEN}
      - CHROMA_SERVER_AUTHN_PROVIDER=
      - CHROMA_CLIENT_AUTH_PROVIDER=chromadb.auth.basic_authn.BasicAuthClientProvider
      - CHROMA_CLIENT_AUTH_CREDENTIALS=sage3:ChromaDB2026!
