version: '3.8'

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: sage3-test-ldap
    ports:
      - "3890:389"
    environment:
      LDAP_ORGANISATION: "SAGE3 Test"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
    restart: "no"

  # NOTE: Redis is intentionally NOT defined here. SAGE3's own dev backend
  # already provides Redis on localhost:6379; starting a second instance here
  # conflicts with it. test.sh verifies the existing Redis is reachable instead.
