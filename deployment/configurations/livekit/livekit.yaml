# LiveKit SFU server configuration for SAGE3 screenshare — PRODUCTION
# https://docs.livekit.io/home/self-hosting/deployment/
#
# This file needs no editing. The only value a deployment supplies is
# LIVEKIT_API_SECRET in deployment/.env, which reaches the server as LIVEKIT_KEYS.
# For local development see livekit-local.yaml, which the -backend- compose files use.

# HTTP/WebSocket signaling port. Reached through traefik at wss://<server>/sfu,
# so it is not published on the host.
port: 7880

rtc:
  # TCP fallback for clients that cannot use UDP
  tcp_port: 7881
  # All WebRTC media is multiplexed over this single UDP port
  # (avoids publishing a large UDP port range through Docker)
  udp_port: 7882
  # Discover the host's public IP via STUN and advertise it to clients. Inside a
  # container the server only sees a private bridge address, which no client can reach.
  #
  # If this server has no outbound STUN access, or STUN reports the wrong address, set
  # this to false and add `node_ip: <the address clients reach>` below. node_ip has no
  # effect while use_external_ip is true — use_external_ip takes precedence.
  use_external_ip: true

# The API key/secret pair used by the SAGE3 server to mint client join tokens is NOT
# stored here. It is passed in as the LIVEKIT_KEYS environment variable by the compose
# file, sourced from LIVEKIT_API_SECRET in deployment/.env, so the one real credential
# lives in a single untracked place and is shared with the SAGE3 server automatically.

# Webhooks notify the SAGE3 server about room/track events, which is what removes a
# screenshare window the moment its publisher stops. node-server resolves over the
# compose network. Requests are signed with the api_key's secret.
webhook:
  api_key: SAGE3
  urls:
    - http://node-server:3000/livekit/webhook

logging:
  level: info
